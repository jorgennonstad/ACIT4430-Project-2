---
- name: Install Monitoring Stack (Prometheus + Grafana)
  hosts: master
  become: true
  gather_facts: false

  vars:
    kubeconfig: /etc/kubernetes/admin.conf

    monitoring_namespace: monitoring
    storage_class: rook-ceph-block

    prometheus_storage_size: 10Gi

    grafana_storage_size: 5Gi
    grafana_nodeport: 30080
    grafana_admin_user: admin
    grafana_admin_password: admin

  tasks:
    - name: Install Helm
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Add Prometheus Helm repo
      ansible.builtin.shell: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts || true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Update Helm repos
      ansible.builtin.shell: helm repo update
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Create monitoring values file from template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/monitoring-values.yaml.j2"
        dest: /tmp/monitoring-values.yaml

    - name: Install Prometheus and Grafana
      ansible.builtin.shell: |
        helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
          --namespace {{ monitoring_namespace }} \
          --create-namespace \
          --values /tmp/monitoring-values.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for Grafana to be ready
      ansible.builtin.shell: kubectl -n {{ monitoring_namespace }} rollout status deployment/monitoring-grafana --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    - name: Check monitoring status
      ansible.builtin.shell: |
        echo "=== Services ==="
        kubectl get svc -n {{ monitoring_namespace }}
        echo ""
        echo "=== Pods ==="
        kubectl get pods -n {{ monitoring_namespace }}
        echo ""
        echo "=== PVCs ==="
        kubectl get pvc -n {{ monitoring_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: monitoring_status
      changed_when: false

    - name: Print monitoring status
      ansible.builtin.debug:
        var: monitoring_status.stdout_lines

    - name: Print Grafana access URL
      ansible.builtin.debug:
        msg: "Grafana should be reachable at http://{{ ansible_host | default(inventory_hostname) }}:{{ grafana_nodeport }}"