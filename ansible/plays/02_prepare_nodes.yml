---
- name: Prepare all nodes for Kubernetes
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Wait for SSH to be ready
      wait_for_connection:
        delay: 5
        timeout: 300

    - name: Ping all VMs
      ping:

    - name: Add inspection key for ubuntu user
      ansible.posix.authorized_key:
        user: ubuntu
        state: present
        key: "{{ lookup('url', 'https://github.com/brunodzogovic.keys') }}"

    - name: Disable swap
      command: swapoff -a

    - name: Remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '^.*swap.*$'
        replace: ''

    - name: Load kernel modules for Kubernetes
      modprobe:
        name: "{{ item }}"
      loop:
        - overlay
        - br_netfilter

    - name: Enable sysctl for Kubernetes networking
      sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: 1
        state: present
        reload: true

    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install base packages
      apt:
        name:
          - python3-apt
          - jed
          - gdisk
          - parted
        state: present


- name: Prepare worker storage disks for Ceph
  hosts: kube_node
  gather_facts: false
  become: true

  vars:
    ceph_disk: /dev/sdb

  tasks:
    - name: Check that Ceph disk exists
      stat:
        path: "{{ ceph_disk }}"
      register: ceph_disk_stat

    - name: Fail if Ceph disk does not exist
      fail:
        msg: "{{ ceph_disk }} does not exist on {{ inventory_hostname }}. Check the OpenStack volume attachment or disk name."
      when: not ceph_disk_stat.stat.exists

    - name: Wipe filesystem signatures from Ceph disk
      command: "wipefs -a {{ ceph_disk }}"

    - name: Zap partition table from Ceph disk
      command: "sgdisk --zap-all {{ ceph_disk }}"
      ignore_errors: true

    - name: Clear first 100MB of Ceph disk
      command: "dd if=/dev/zero of={{ ceph_disk }} bs=1M count=100 oflag=direct"

    - name: Refresh partition table
      command: "partprobe {{ ceph_disk }}"
      ignore_errors: true