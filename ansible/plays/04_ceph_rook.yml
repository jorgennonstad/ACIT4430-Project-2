---
- name: Install Rook Ceph
  hosts: master
  become: true
  gather_facts: false

  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    rook_version: v1.19.4

  tasks:
    - name: Install Rook operator resources
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/rook/rook/{{ rook_version }}/deploy/examples/crds.yaml
        kubectl apply -f https://raw.githubusercontent.com/rook/rook/{{ rook_version }}/deploy/examples/common.yaml
        kubectl apply -f https://raw.githubusercontent.com/rook/rook/{{ rook_version }}/deploy/examples/csi-operator.yaml
        kubectl apply -f https://raw.githubusercontent.com/rook/rook/{{ rook_version }}/deploy/examples/operator.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Create Ceph cluster config
      copy:
        dest: /tmp/ceph-cluster.yaml
        content: |
          apiVersion: ceph.rook.io/v1
          kind: CephCluster
          metadata:
            name: rook-ceph
            namespace: rook-ceph
          spec:
            dataDirHostPath: /var/lib/rook
            mon:
              count: 3
            storage:
              useAllNodes: false
              useAllDevices: false
              nodes:
                - name: worker-1
                  devices:
                    - name: sdb
                - name: worker-2
                  devices:
                    - name: sdb
                - name: worker-3
                  devices:
                    - name: sdb

    - name: Apply Ceph cluster
      shell: kubectl apply -f /tmp/ceph-cluster.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Create block pool and storage class
      copy:
        dest: /tmp/rook-storage.yaml
        content: |
          apiVersion: ceph.rook.io/v1
          kind: CephBlockPool
          metadata:
            name: replicapool
            namespace: rook-ceph
          spec:
            failureDomain: host
            replicated:
              size: 3
          ---
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: rook-ceph-block
          provisioner: rook-ceph.rbd.csi.ceph.com
          parameters:
            clusterID: rook-ceph
            pool: replicapool
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
          reclaimPolicy: Delete
          allowVolumeExpansion: true

    - name: Apply block pool and storage class
      shell: kubectl apply -f /tmp/rook-storage.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Show Rook pods
      shell: kubectl -n rook-ceph get pod
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: rook_pods
      changed_when: false

    - name: Print Rook pod status
      debug:
        var: rook_pods.stdout_lines