---
- name: Install Rook Ceph
  hosts: master
  become: true
  gather_facts: false

  vars:
    kubeconfig: /etc/kubernetes/admin.conf

    rook_namespace: rook-ceph
    rook_version: v1.19.4
    rook_examples_base: https://raw.githubusercontent.com/rook/rook/{{ rook_version }}/deploy/examples

    ceph_cluster_name: rook-ceph
    ceph_image: quay.io/ceph/ceph:v19.2.3
    ceph_data_dir_host_path: /var/lib/rook
    ceph_mon_count: 3

    storage_class: rook-ceph-block

    ceph_storage_nodes:
      - name: worker-1
        device: sdb
      - name: worker-2
        device: sdb
      - name: worker-3
        device: sdb

    ceph_test_pvc_name: ceph-test-pvc
    ceph_test_pod_name: ceph-test-pod
    ceph_test_pvc_size: 1Gi

  tasks:
    - name: Install Rook operator resources
      ansible.builtin.shell: |
        kubectl apply -f {{ rook_examples_base }}/crds.yaml
        kubectl apply -f {{ rook_examples_base }}/common.yaml
        kubectl apply -f {{ rook_examples_base }}/csi-operator.yaml
        kubectl apply -f {{ rook_examples_base }}/operator.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for rook-ceph-operator to be running
      ansible.builtin.shell: kubectl -n {{ rook_namespace }} get pod
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: rook_operator
      retries: 20
      delay: 15
      until: "'rook-ceph-operator' in rook_operator.stdout and 'Running' in rook_operator.stdout"
      changed_when: false

    - name: Create custom Ceph cluster manifest from template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/rook-cluster.yaml.j2"
        dest: /tmp/rook-cluster.yaml

    - name: Apply custom Ceph cluster
      ansible.builtin.shell: kubectl apply -f /tmp/rook-cluster.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for CephCluster to become healthy
      ansible.builtin.shell: kubectl -n {{ rook_namespace }} get cephcluster {{ ceph_cluster_name }} -o jsonpath='{.status.ceph.health}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: ceph_health
      retries: 30
      delay: 20
      until: ceph_health.stdout == "HEALTH_OK"
      changed_when: false

    - name: Apply block pool and storage class
      ansible.builtin.shell: kubectl apply -f "{{ rook_examples_base }}/csi/rbd/storageclass.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Create test PVC and pod manifest from template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/ceph-test.yaml.j2"
        dest: /tmp/ceph-test.yaml

    - name: Apply test PVC and pod
      ansible.builtin.shell: kubectl apply -f /tmp/ceph-test.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for PVC to be Bound
      ansible.builtin.shell: kubectl get pvc {{ ceph_test_pvc_name }} -o jsonpath='{.status.phase}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: pvc_phase
      retries: 20
      delay: 10
      until: pvc_phase.stdout == "Bound"
      changed_when: false

    - name: Wait for test pod to be Running
      ansible.builtin.shell: kubectl get pod {{ ceph_test_pod_name }} -o jsonpath='{.status.phase}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: pod_phase
      retries: 20
      delay: 10
      until: pod_phase.stdout == "Running"
      changed_when: false

    - name: Show Ceph status
      ansible.builtin.shell: |
        echo "=== CephCluster ==="
        kubectl -n {{ rook_namespace }} get cephcluster
        echo ""
        echo "=== Rook pods ==="
        kubectl -n {{ rook_namespace }} get pods
        echo ""
        echo "=== StorageClass ==="
        kubectl get storageclass {{ storage_class }}
        echo ""
        echo "=== Test PVC ==="
        kubectl get pvc {{ ceph_test_pvc_name }}
        echo ""
        echo "=== Test pod ==="
        kubectl get pod {{ ceph_test_pod_name }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: ceph_status
      changed_when: false

    - name: Print Ceph status
      ansible.builtin.debug:
        var: ceph_status.stdout_lines