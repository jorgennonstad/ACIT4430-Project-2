---
- name: Install Rook Ceph
  hosts: master
  become: true
  gather_facts: false

  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    rook_version: v1.19.4
    rook_examples_base: https://raw.githubusercontent.com/rook/rook/{{ rook_version }}/deploy/examples

  tasks:
    - name: Install Rook operator resources
      shell: |
        kubectl apply -f {{ rook_examples_base }}/crds.yaml
        kubectl apply -f {{ rook_examples_base }}/common.yaml
        kubectl apply -f {{ rook_examples_base }}/csi-operator.yaml
        kubectl apply -f {{ rook_examples_base }}/operator.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for rook-ceph-operator to be running
      shell: kubectl -n rook-ceph get pod
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: rook_operator
      retries: 20
      delay: 15
      until: "'rook-ceph-operator' in rook_operator.stdout and 'Running' in rook_operator.stdout"
      changed_when: false

    - name: Copy custom Ceph cluster manifest
      copy:
        dest: /tmp/rook-cluster.yaml
        content: |
          apiVersion: ceph.rook.io/v1
          kind: CephCluster
          metadata:
            name: rook-ceph
            namespace: rook-ceph
          spec:
            cephVersion:
              image: quay.io/ceph/ceph:v19.2.3
              allowUnsupported: false
            dataDirHostPath: /var/lib/rook
            mon:
              count: 3
            storage:
              useAllNodes: false
              useAllDevices: false
              nodes:
                - name: worker-1
                  devices:
                    - name: sdb
                - name: worker-2
                  devices:
                    - name: sdb
                - name: worker-3
                  devices:
                    - name: sdb

    - name: Apply custom Ceph cluster
      shell: kubectl apply -f /tmp/rook-cluster.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for CephCluster to become healthy
      shell: kubectl -n rook-ceph get cephcluster rook-ceph -o jsonpath='{.status.ceph.health}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: ceph_health
      retries: 30
      delay: 20
      until: ceph_health.stdout == "HEALTH_OK"
      changed_when: false

    - name: Apply block pool and storage class
      shell: kubectl apply -f "{{ rook_examples_base }}/csi/rbd/storageclass.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Create test PVC and pod manifest
      copy:
        dest: /tmp/ceph-test.yaml
        content: |
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ceph-test-pvc
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: rook-ceph-block
            resources:
              requests:
                storage: 1Gi
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: ceph-test-pod
          spec:
            containers:
              - name: app
                image: busybox
                command: ["/bin/sh", "-c", "echo hello-from-ceph > /data/test.txt && sleep 3600"]
                volumeMounts:
                  - name: ceph-storage
                    mountPath: /data
            volumes:
              - name: ceph-storage
                persistentVolumeClaim:
                  claimName: ceph-test-pvc

    - name: Apply test PVC and pod
      shell: kubectl apply -f /tmp/ceph-test.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for PVC to be Bound
      shell: kubectl get pvc ceph-test-pvc -o jsonpath='{.status.phase}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: pvc_phase
      retries: 20
      delay: 10
      until: pvc_phase.stdout == "Bound"
      changed_when: false

    - name: Wait for test pod to be Running
      shell: kubectl get pod ceph-test-pod -o jsonpath='{.status.phase}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: pod_phase
      retries: 20
      delay: 10
      until: pod_phase.stdout == "Running"
      changed_when: false

    - name: Check PVC status
      shell: kubectl get pvc ceph-test-pvc
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: pvc_status
      changed_when: false

    - name: Print PVC status
      debug:
        var: pvc_status.stdout_lines

    - name: Check pod status
      shell: kubectl get pod ceph-test-pod
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: pod_status
      changed_when: false

    - name: Print pod status
      debug:
        var: pod_status.stdout_lines

    - name: Show Rook pods
      shell: kubectl -n rook-ceph get pod
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: rook_pods
      changed_when: false

    - name: Print Rook pod status
      debug:
        var: rook_pods.stdout_lines