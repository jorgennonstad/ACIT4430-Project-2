- name: Install Logging Stack (Loki + Promtail)
  hosts: master
  become: true
  gather_facts: false

  vars:
    kubeconfig: /etc/kubernetes/admin.conf

  tasks:
    # ---------------- HELM INSTALL ----------------
    - name: Install Helm
      shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    # ---------------- REPOS ----------------
    - name: Add Grafana Helm repo
      shell: helm repo add grafana https://grafana.github.io/helm-charts || true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Update Helm repos
      shell: helm repo update
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    # ---------------- LOGGING STACK ----------------
    - name: Install Loki and Promtail
      shell: |
        helm upgrade --install loki grafana/loki-stack \
          --namespace logging \
          --create-namespace \
          --set loki.persistence.enabled=true \
          --set loki.persistence.storageClassName=rook-ceph-block \
          --set loki.persistence.size=5Gi \
          --set promtail.enabled=true \
          --set grafana.enabled=false
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    # ---------------- GRAFANA LOKI DATASOURCE ----------------
    - name: Add Loki datasource to Grafana
      copy:
        dest: /tmp/grafana-loki-datasource.yaml
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-loki-datasource
            namespace: monitoring
            labels:
              grafana_datasource: "1"
          data:
            loki-datasource.yaml: |
              apiVersion: 1
              datasources:
                - name: Loki
                  type: loki
                  uid: loki
                  access: proxy
                  url: http://loki.logging.svc.cluster.local:3100
                  isDefault: false

    - name: Apply Loki datasource ConfigMap
      shell: kubectl apply -f /tmp/grafana-loki-datasource.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    # ---------------- VERIFY ----------------
    - name: Check logging pods
      shell: kubectl get pods -n logging
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: logging_pods
      changed_when: false

    - name: Print logging pod status
      debug:
        var: logging_pods.stdout_lines

    - name: Check logging PVCs
      shell: kubectl get pvc -n logging
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: logging_pvcs
      changed_when: false

    - name: Print logging PVC status
      debug:
        var: logging_pvcs.stdout_lines