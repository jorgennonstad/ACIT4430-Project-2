---
- name: Install Logging Stack (Loki + Grafana Alloy)
  hosts: master
  become: true
  gather_facts: false

  vars:
    kubeconfig: /etc/kubernetes/admin.conf

    logging_namespace: logging
    monitoring_namespace: monitoring
    storage_class: rook-ceph-block
    cluster_name: acit4430-project2

  tasks:
    - name: Add Grafana Helm repo
      ansible.builtin.shell: helm repo add grafana https://grafana.github.io/helm-charts || true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Add Grafana Community Helm repo
      ansible.builtin.shell: helm repo add grafana-community https://grafana-community.github.io/helm-charts || true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Update Helm repos
      ansible.builtin.shell: helm repo update
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Create logging namespace
      ansible.builtin.shell: kubectl create namespace {{ logging_namespace }} || true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Copy Loki values file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/loki-values.yaml.j2"
        dest: /tmp/loki-values.yaml

    - name: Copy Alloy values file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/alloy-values.yaml.j2"
        dest: /tmp/alloy-values.yaml

    - name: Install Loki
      ansible.builtin.shell: |
        helm upgrade --install loki grafana-community/loki \
          --namespace {{ logging_namespace }} \
          --values /tmp/loki-values.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Install Grafana Alloy
      ansible.builtin.shell: |
        helm upgrade --install alloy grafana/alloy \
          --namespace {{ logging_namespace }} \
          --values /tmp/alloy-values.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Create Loki datasource manifest for Grafana
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/grafana-loki-datasource.yaml.j2"
        dest: /tmp/grafana-loki-datasource.yaml

    - name: Apply Loki datasource ConfigMap
      ansible.builtin.shell: kubectl apply -f /tmp/grafana-loki-datasource.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for Loki StatefulSet to be ready
      ansible.builtin.shell: kubectl -n {{ logging_namespace }} rollout status statefulset/loki --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    - name: Wait for Alloy DaemonSet to be ready
      ansible.builtin.shell: kubectl -n {{ logging_namespace }} rollout status daemonset/alloy --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    - name: Wait for Grafana to be ready
      ansible.builtin.shell: kubectl -n {{ monitoring_namespace }} rollout status deployment/monitoring-grafana --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    - name: Check logging status
      ansible.builtin.shell: |
        echo "=== Pods ==="
        kubectl get pods -n {{ logging_namespace }}
        echo ""
        echo "=== Services ==="
        kubectl get svc -n {{ logging_namespace }}
        echo ""
        echo "=== PVCs ==="
        kubectl get pvc -n {{ logging_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: logging_status
      changed_when: false

    - name: Print logging status
      ansible.builtin.debug:
        var: logging_status.stdout_lines

    - name: Test Loki readiness from Grafana pod
      ansible.builtin.shell: |
        kubectl -n {{ monitoring_namespace }} exec deploy/monitoring-grafana -c grafana -- \
          sh -c 'wget -qO- http://loki.{{ logging_namespace }}.svc.cluster.local:3100/ready'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: loki_ready
      changed_when: false

    - name: Print Loki readiness result
      ansible.builtin.debug:
        var: loki_ready.stdout_lines