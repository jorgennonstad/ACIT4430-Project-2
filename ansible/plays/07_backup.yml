---
- name: Install Backup System with Veeam Kasten K10
  hosts: master
  become: true
  gather_facts: false

  vars:
    kubeconfig: /etc/kubernetes/admin.conf

    kasten_namespace: kasten-io
    kasten_release_name: k10
    kasten_chart: kasten/k10
    kasten_version: "8.5.8"
    kasten_nodeport: 30808

    kasten_storage_class: rook-ceph-block
    rook_namespace: rook-ceph
    rook_rbd_snapshotclass: rook-ceph-block-snapclass

    snapshotter_version: v8.2.0
    kasten_key_path: /tmp/RPM-KASTEN

    backup_namespaces:
      - default
      - monitoring
      - logging

  tasks:
    # ---------------- HELM ----------------
    - name: Install Helm
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Add Kasten Helm repo
      ansible.builtin.shell: helm repo add kasten https://charts.kasten.io/ || true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Update Helm repos
      ansible.builtin.shell: helm repo update
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    # ---------------- CHART VERIFICATION ----------------
    - name: Download Kasten Helm chart public signing key
      ansible.builtin.get_url:
        url: https://repository.veeam.com/keys/RPM-KASTEN
        dest: "{{ kasten_key_path }}"
        mode: "0644"

    - name: Verify Kasten chart provenance before installation
      ansible.builtin.command:
        argv:
          - helm
          - pull
          - --prov
          - "{{ kasten_chart }}"
          - --version
          - "{{ kasten_version }}"
          - --verify
          - --keyring
          - "{{ kasten_key_path }}"
          - --destination
          - /tmp
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    # ---------------- NAMESPACE ----------------
    - name: Create Kasten namespace
      ansible.builtin.shell: kubectl create namespace {{ kasten_namespace }} || true
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Label namespaces for Kasten backup policies
      ansible.builtin.shell: >
        kubectl label namespace {{ item }}
        k10.kasten.io/appNamespace={{ item }}
        --overwrite
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop: "{{ backup_namespaces }}"

    # ---------------- SNAPSHOT SUPPORT ----------------
    - name: Install VolumeSnapshot CRDs
      ansible.builtin.shell: |
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ snapshotter_version }}/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ snapshotter_version }}/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ snapshotter_version }}/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Install snapshot controller
      ansible.builtin.shell: |
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ snapshotter_version }}/deploy/kubernetes/snapshot-controller/rbac-snapshot-controller.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ snapshotter_version }}/deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Create Rook-Ceph RBD VolumeSnapshotClass manifest
      ansible.builtin.copy:
        dest: /tmp/rook-ceph-rbd-snapshotclass.yaml
        content: |
          apiVersion: snapshot.storage.k8s.io/v1
          kind: VolumeSnapshotClass
          metadata:
            name: {{ rook_rbd_snapshotclass }}
            annotations:
              k10.kasten.io/is-snapshot-class: "true"
          driver: rook-ceph.rbd.csi.ceph.com
          parameters:
            clusterID: {{ rook_namespace }}
            csi.storage.k8s.io/snapshotter-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/snapshotter-secret-namespace: {{ rook_namespace }}
          deletionPolicy: Delete

    - name: Apply Rook-Ceph RBD VolumeSnapshotClass
      ansible.builtin.shell: kubectl apply -f /tmp/rook-ceph-rbd-snapshotclass.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Connect Rook-Ceph StorageClass to Kasten snapshot class
      ansible.builtin.shell: >
        kubectl annotate storageclass {{ kasten_storage_class }}
        k10.kasten.io/volume-snapshot-class={{ rook_rbd_snapshotclass }}
        --overwrite
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    # ---------------- PRE-FLIGHT CHECK ----------------
    - name: Run Kasten pre-flight checks
      ansible.builtin.shell: |
        curl -fsSL https://docs.kasten.io/downloads/{{ kasten_version }}/tools/k10_primer.sh | bash
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: kasten_primer
      changed_when: false

    - name: Print Kasten pre-flight check result
      ansible.builtin.debug:
        var: kasten_primer.stdout_lines

    # ---------------- INSTALL KASTEN ----------------
    - name: Install Kasten K10 with verified Helm chart
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - "{{ kasten_release_name }}"
          - "{{ kasten_chart }}"
          - --namespace
          - "{{ kasten_namespace }}"
          - --create-namespace
          - --version
          - "{{ kasten_version }}"
          - --verify
          - --keyring
          - "{{ kasten_key_path }}"
          - --set
          - "global.persistence.storageClass={{ kasten_storage_class }}"
          - --set
          - "rbac.create=true"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for Kasten deployments to become available
      ansible.builtin.shell: >
        kubectl -n {{ kasten_namespace }}
        wait --for=condition=Available deployment --all --timeout=600s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    # ---------------- EXPOSE KASTEN DASHBOARD ----------------
    - name: Create Kasten Gateway NodePort Service manifest
      ansible.builtin.copy:
        dest: /tmp/kasten-gateway-nodeport.yaml
        content: |
          apiVersion: v1
          kind: Service
          metadata:
            name: gateway-nodeport
            namespace: {{ kasten_namespace }}
          spec:
            type: NodePort
            selector:
              service: gateway
            ports:
              - name: http
                port: 80
                targetPort: 8000
                nodePort: {{ kasten_nodeport }}

    - name: Apply Kasten Gateway NodePort Service
      ansible.builtin.shell: kubectl apply -f /tmp/kasten-gateway-nodeport.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    # ---------------- BACKUP POLICIES ----------------
    - name: Create Kasten backup policy manifests from template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/kasten-policy.yaml.j2"
        dest: "/tmp/kasten-policy-{{ item }}.yaml"
      vars:
        backup_namespace: "{{ item }}"
      loop: "{{ backup_namespaces }}"

    - name: Apply Kasten backup policies
      ansible.builtin.shell: kubectl apply -f /tmp/kasten-policy-{{ item }}.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop: "{{ backup_namespaces }}"
    
        # ---------------- RUN BACKUP POLICIES ONCE ----------------
    - name: Wait for Kasten policies to validate successfully
      ansible.builtin.shell: >
        kubectl -n {{ kasten_namespace }}
        get policy.config.kio.kasten.io backup-{{ item }}
        -o jsonpath='{.status.validation}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: policy_validation
      retries: 30
      delay: 10
      until: policy_validation.stdout == "Success"
      changed_when: false
      loop: "{{ backup_namespaces }}"

    - name: Create Kasten RunAction manifests
      ansible.builtin.copy:
        dest: "/tmp/kasten-run-backup-{{ item }}.yaml"
        content: |
          apiVersion: actions.kio.kasten.io/v1alpha1
          kind: RunAction
          metadata:
            generateName: run-backup-{{ item }}-
            namespace: {{ kasten_namespace }}
          spec:
            subject:
              kind: Policy
              name: backup-{{ item }}
              namespace: {{ kasten_namespace }}
      loop: "{{ backup_namespaces }}"

    - name: Run each Kasten backup policy once
      ansible.builtin.shell: >
        kubectl create -f /tmp/kasten-run-backup-{{ item }}.yaml
        -o jsonpath='{.metadata.name}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: kasten_runactions
      loop: "{{ backup_namespaces }}"

    - name: Wait for Kasten policy runs to complete
      ansible.builtin.shell: >
        kubectl -n {{ kasten_namespace }}
        get runactions.actions.kio.kasten.io {{ item.stdout }}
        -o jsonpath='{.status.state}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: runaction_status
      retries: 60
      delay: 15
      until: runaction_status.stdout == "Complete"
      changed_when: false
      loop: "{{ kasten_runactions.results }}"

    # ---------------- VERIFY ----------------
    - name: Show Kasten status
      ansible.builtin.shell: |
        echo "=== Pods ==="
        kubectl get pods -n {{ kasten_namespace }}
        echo ""
        echo "=== PVCs ==="
        kubectl get pvc -n {{ kasten_namespace }}
        echo ""
        echo "=== VolumeSnapshotClasses ==="
        kubectl get volumesnapshotclass
        echo ""
        echo "=== Backup Policies ==="
        kubectl get policies.config.kio.kasten.io -n {{ kasten_namespace }}
        echo ""
        echo "=== Services ==="
        kubectl get svc -n {{ kasten_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: kasten_status
      changed_when: false

    - name: Print Kasten status
      ansible.builtin.debug:
        var: kasten_status.stdout_lines

    - name: Show dashboard access instructions
      ansible.builtin.debug:
        msg:
          - "Kasten K10 is installed in namespace {{ kasten_namespace }}."
          - "Dashboard URL: http://{{ ansible_host | default(inventory_hostname) }}:{{ kasten_nodeport }}/k10/#/"
          - "No dashboard authentication is currently enabled."
          - "For a production setup, enable token auth, basic auth with HTTPS, or another supported authentication method."